[project]
name = "supportkit"
version = "0.0.1"
description = "Config-driven AI customer support agent for Thai online shops, built with LangGraph"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "langgraph>=1.2.12,<1.3",              # interrupt(response_schema=...) needs >=1.2.12
    "langgraph-checkpoint-postgres>=3.2,<4",
    "langchain>=1.5,<2",
    "psycopg[binary,pool]>=3.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7.4,<3",
    "pydantic-settings>=2.4",
    "pyyaml>=6",
    "line-bot-sdk>=3.27,<4",
    "alembic>=1.13",
    "sqlalchemy>=2.0",
    "typer>=0.12",
    "langchain-anthropic>=1.7.10",
    "tzdata>=2026.6",
]

[project.scripts]
supportkit = "supportkit.cli:app"

[dependency-groups]
dev = [
    "faker>=40.54.0",
    "httpx>=0.27",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=7.1.0",
    "ruff>=0.6",
    "streamlit>=1.67.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/supportkit"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
extend-select = ["W292"]  # missing final newline

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
